; PlatformIO project for the Pi-MFX USB-MIDI floorboard.
; Flash:  cd firmware/esp32s3 && pio run -t upload
; Sketch: PiMFX_Controller/PiMFX_Controller.ino

[platformio]
src_dir = PiMFX_Controller

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_archive = no
lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit NeoPixel
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DUSE_TINYUSB
    -DCFG_TUD_MIDI=1
    -DCFG_TUD_CDC=0
